  <script>
    (() => {
      const key = "fishDuelDeviceAudio";
      const gear = document.getElementById("entry-gear");
      const panel = document.getElementById("entry-audio");
      const menu = document.querySelector("#entry .menu");
      const mute = document.getElementById("entry-muted");
      const sliders = [...panel.querySelectorAll("input[type=range]")];
      let stored = null;
      try { stored = JSON.parse(localStorage.getItem(key)); } catch {}
      window.fishDuelEntryAudio = {
        read: () => JSON.stringify(stored),
        write(json) {
          const values = JSON.parse(json);
          stored = { audio_muted: values.audio_muted };
          for (const slider of sliders) stored[slider.id] = values[slider.id];
          try { localStorage.setItem(key, JSON.stringify(stored)); } catch {}
        }
      };
      function toggle() {
        panel.hidden = !panel.hidden;
        menu.inert = !panel.hidden;
        gear.setAttribute("aria-expanded", String(!panel.hidden));
        if (panel.hidden) { gear.focus(); return; }
        if (stored) {
          mute.checked = stored.audio_muted === true;
          for (const slider of sliders) slider.value = Math.round(stored[slider.id] * 100);
        }
        mute.focus();
      }
      panel.addEventListener("input", () => {
        const values = { audio_muted: mute.checked };
        for (const slider of sliders) values[slider.id] = Number(slider.value) / 100;
        window.fishDuelEntryAudio.write(JSON.stringify(values));
      });
      gear.onclick = toggle;
      document.getElementById("entry-back").onclick = toggle;
      document.addEventListener("keydown", event => {
        if (event.key === "Escape" && !panel.hidden && !gear.closest("[hidden]")) toggle();
      });
    })();
  </script>

  <script>
    (() => {
      const canvas = document.getElementById("canvas");
      const panel = document.getElementById("battle-video");
      const status = document.getElementById("battle-video-status");
      const download = document.getElementById("battle-video-download");
      const close = document.getElementById("battle-video-close");
      let active;
      let downloadUrl;

      function releaseDownload() {
        if (downloadUrl) URL.revokeObjectURL(downloadUrl);
        downloadUrl = undefined;
        download.removeAttribute("href");
        download.hidden = true;
      }

      function closePanel() {
        releaseDownload();
        panel.hidden = true;
        if (!canvas.hidden) canvas.focus();
      }

      function showStatus(message, label) {
        status.textContent = message;
        close.textContent = label;
        panel.hidden = false;
      }

      function endSession(session) {
        active = undefined;
        canvas.inert = false;
        if (session.recorder.state !== "inactive") session.recorder.stop();
        session.stream.getTracks().forEach(track => track.stop());
      }

      function cancel(notifyGame, message) {
        if (!active) return;
        const session = active;
        endSession(session);
        if (notifyGame && !session.finished) session.onCancel();
        if (message) showStatus(message, "關閉");
        else closePanel();
      }

      close.addEventListener("click", () => active ? cancel(true) : closePanel());
      panel.addEventListener("keydown", event => {
        if (event.key === "Escape") {
          event.preventDefault();
          close.click();
        }
      });
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) cancel(true, "錄製已中止，請留在遊戲畫面再試一次。");
      });

      window.fishDuelVideo = {
        isSupported() {
          return typeof MediaRecorder === "function" && typeof canvas.captureStream === "function";
        },
        start(filename, onCancel) {
          if (active || !this.isSupported()) return false;
          releaseDownload();
          let stream;
          try {
            stream = canvas.captureStream(30);
            const mimeType = ["video/mp4", "video/webm;codecs=vp8", "video/webm"]
              .find(type => MediaRecorder.isTypeSupported(type));
            const recorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 3500000 });
            const session = { recorder, stream, onCancel };
            const chunks = [];
            recorder.addEventListener("dataavailable", event => {
              if (event.data.size > 0) chunks.push(event.data);
            });
            recorder.addEventListener("error", () => {
              if (active === session) cancel(true, "錄製失敗，請再試一次。");
            });
            recorder.addEventListener("stop", () => {
              if (active !== session) return;
              endSession(session);
              if (!session.finished) session.onCancel();
              if (!session.finished || chunks.length === 0) {
                showStatus("錄製失敗，請再試一次。", "關閉");
                return;
              }
              const type = recorder.mimeType || chunks[0].type;
              downloadUrl = URL.createObjectURL(new Blob(chunks, { type }));
              download.href = downloadUrl;
              download.download = filename + (type.startsWith("video/mp4") ? ".mp4" : ".webm");
              download.hidden = false;
              showStatus("影片已準備好", "關閉");
              download.click();
            });
            recorder.start(1000);
            active = session;
            canvas.inert = true;
            showStatus("正在錄製完整對戰…", "取消");
            close.focus();
            return true;
          } catch {
            if (stream) stream.getTracks().forEach(track => track.stop());
            showStatus("這個瀏覽器無法開始錄製。", "關閉");
            return false;
          }
        },
        finish() {
          if (!active || active.recorder.state === "inactive") return;
          active.finished = true;
          active.recorder.stop();
        },
        cancel() {
          cancel(false);
        }
      };
    })();
