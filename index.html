  <script>
    // Static match cards need fewer updates than the tank and battle animations.
    let lastGameFrame = -Infinity;
    window.fishDuelScheduleFrame = function schedule(run, loop) {
      loop.requestAnimationFrame(function frame(time) {
        let fps = 0;
        if (window.fishDuelBattleActive) fps = window.fishDuelBattleFps === 60 ? 60 : 30;
        else if (window.fishDuelTankActive || window.fishDuelFishingActive) fps = 30;
        else if (window.fishDuelCompetitionActive) fps = 20;
        if (fps && Number.isFinite(time)) {
          if (time - lastGameFrame < 1000 / fps - 1) {
            loop.requestAnimationFrame(frame);
            return;
          }
          lastGameFrame = time;
        } else {
          lastGameFrame = -Infinity;
        }
        run(time);
      });
    };
  </script>

  <script>
    (() => {
      const key = "fishDuelDeviceAudio";
      const gear = document.getElementById("entry-gear");
      const panel = document.getElementById("entry-audio");
      const menu = document.querySelector("#entry .menu");
      const mute = document.getElementById("entry-muted");
      const sliders = [...panel.querySelectorAll("input[type=range]")];
      let stored = null;
      try { stored = JSON.parse(localStorage.getItem(key)); } catch {}
      window.fishDuelEntryAudio = {
        read: () => JSON.stringify(stored),
        write(json) {
          const values = JSON.parse(json);
          stored = { audio_muted: values.audio_muted };
          for (const slider of sliders) stored[slider.id] = values[slider.id];
          try { localStorage.setItem(key, JSON.stringify(stored)); } catch {}
        }
      };
      function toggle() {
        panel.hidden = !panel.hidden;
        menu.inert = !panel.hidden;
        document.getElementById("entry-language").hidden = !panel.hidden;
        gear.setAttribute("aria-expanded", String(!panel.hidden));
        if (panel.hidden) { gear.focus(); return; }
        if (stored) {
          mute.checked = stored.audio_muted === true;
          for (const slider of sliders) slider.value = Math.round(stored[slider.id] * 100);
        }
        for (const slider of sliders) slider.previousElementSibling.value = slider.value + "%";
        mute.focus();
      }
      panel.addEventListener("input", event => {
        if (event.target.id === "entry-language-select") return;
        if (event.target.type === "range") event.target.previousElementSibling.value = event.target.value + "%";
        const values = { audio_muted: mute.checked };
        for (const slider of sliders) values[slider.id] = Number(slider.value) / 100;
        window.fishDuelEntryAudio.write(JSON.stringify(values));
      });
      gear.onclick = toggle;
      document.getElementById("entry-back").onclick = toggle;
      document.addEventListener("keydown", event => {
        if (event.key === "Escape" && !panel.hidden && !gear.closest("[hidden]")) toggle();
      });
    })();
  </script>

      function audioOutput(context) {

        if (audioMix?.context !== context) {
          audioMix = context.createGain();
          audioMix.connect(context.destination);
        }
        return audioMix;
      }

      function fitRecordingCanvas() {
        const compact = matchMedia("(pointer: coarse)").matches || (navigator.deviceMemory || 8) <= 4;
        const longest = Math.max(canvas.width, canvas.height);
        const shortest = Math.min(canvas.width, canvas.height);
        const scale = Math.min(1, (compact ? 1280 : 1920) / longest, (compact ? 720 : 1080) / shortest);
        // Even dimensions also work with hardware H.264 encoders.
        const width = Math.max(2, Math.floor(canvas.width * scale / 2) * 2);
        const height = Math.max(2, Math.floor(canvas.height * scale / 2) * 2);
        if (canvas.width !== width) canvas.width = width;
        if (canvas.height !== height) canvas.height = height;
        return compact ? 7000000 : 12000000;
      }

      function startRecorder(stream, videoBitsPerSecond) {
        for (const mimeType of recordingFormats) {
          if (!MediaRecorder.isTypeSupported(mimeType)) continue;
          try {
            const recorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond, audioBitsPerSecond: 160000 });
            recorder.start(1000);
            return recorder;
          } catch {
            // Some encoders advertise a format they cannot start with this stream.
          }
        }
        throw new Error("No supported recording format could start");
      }

      function captureFrames(session, track) {
        const interval = 1000 / recordingFps;
        let nextFrame = performance.now();
        const capture = now => {
          if (active !== session || session.recorder.state !== "recording") return;
          // Allow for display refresh jitter without skipping every other frame.
          if (now + 2 >= nextFrame) {
            track.requestFrame();
            nextFrame = Math.max(nextFrame + interval, now);
          }
          session.animation = requestAnimationFrame(capture);
        };
        session.animation = requestAnimationFrame(capture);
      }

      function releaseDownload() {
        if (downloadUrl) URL.revokeObjectURL(downloadUrl);
        downloadUrl = undefined;
        download.removeAttribute("href");
        download.hidden = true;
      }

      function closePanel() {
        releaseDownload();
        panel.hidden = true;
        if (!canvas.hidden) canvas.focus();
      }

      function showStatus(message, label) {
        status.textContent = message;
        close.textContent = label;
        panel.hidden = false;
      }

      function endSession(session) {
        active = undefined;
        if (session.animation !== undefined) cancelAnimationFrame(session.animation);
        canvas.inert = false;
        if (session.recorder.state !== "inactive") session.recorder.stop();
        session.mix.disconnect(session.audio);
        session.stream.getTracks().forEach(track => track.stop());
        canvas.dispatchEvent(new Event("fishduel-capture-ended"));
      }

      function cancel(notifyGame, message) {
        if (!active) return;
        const session = active;
        endSession(session);
        if (notifyGame && !session.finished) session.onCancel();
        if (message) showStatus(message, "關閉");
        else closePanel();
      }

      close.addEventListener("click", () => active ? cancel(true) : closePanel());
      panel.addEventListener("keydown", event => {
        if (event.key === "Escape") {
          event.preventDefault();
          close.click();
        }
      });
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) cancel(true, "錄製已中止，請留在遊戲畫面再試一次。");
      });

      window.fishDuelVideo = {
        audioOutput,
        isRecording: () => active !== undefined,
        isSupported() {
          return typeof MediaRecorder === "function" && typeof canvas.captureStream === "function"
            && typeof window.AudioContext !== "undefined"
            && typeof window.AudioContext.prototype.createMediaStreamDestination === "function"
            && recordingFormats.some(type => MediaRecorder.isTypeSupported(type));
        },
        start(filename, onCancel) {
          if (active || !this.isSupported()) return false;
          releaseDownload();
          const mix = audioMix;
          if (!mix || mix.context.state === "closed") {
            showStatus("遊戲音訊尚未準備好，請再試一次。", "關閉");
            return false;
          }
          let stream;
          let audio;
          try {
            const videoBitsPerSecond = fitRecordingCanvas();
            const manualFrames = typeof window.CanvasCaptureMediaStreamTrack?.prototype.requestFrame === "function";
            stream = canvas.captureStream(manualFrames ? 0 : recordingFps);
            const audioDestination = mix.context.createMediaStreamDestination();
            mix.connect(audioDestination);
            audio = audioDestination;
            stream.addTrack(audio.stream.getAudioTracks()[0]);
            const recorder = startRecorder(stream, videoBitsPerSecond);
            const session = { recorder, stream, mix, audio, onCancel };
            const chunks = [];
            recorder.addEventListener("dataavailable", event => {
              if (event.data.size > 0) chunks.push(event.data);
            });
            recorder.addEventListener("error", () => {
              if (active === session) cancel(true, "錄製失敗，請再試一次。");
            });
            recorder.addEventListener("stop", () => {
              if (active !== session) return;
              endSession(session);
              if (!session.finished) session.onCancel();
              if (!session.finished || chunks.length === 0) {
                showStatus("錄製失敗，請再試一次。", "關閉");
                return;
              }
              const type = chunks.find(chunk => chunk.type)?.type || recorder.mimeType;
              const mp4 = type.startsWith("video/mp4");
              downloadUrl = URL.createObjectURL(new Blob(chunks, { type }));
              download.href = downloadUrl;
              download.download = filename + (mp4 ? ".mp4" : ".webm");
              download.textContent = mp4 ? "儲存 MP4" : "儲存 WebM";
              download.hidden = false;
              showStatus(mp4 ? "MP4 影片已準備好" : "此瀏覽器未能錄製 MP4，WebM 影片已準備好。", "關閉");
              download.click();
            });
            active = session;
            if (manualFrames) captureFrames(session, stream.getVideoTracks()[0]);
            if (mix.context.state !== "running") {
              mix.context.resume().catch(() => {
                if (active === session) cancel(true, "遊戲音訊無法啟動，請再試一次。");
              });
            }
            canvas.inert = true;
            showStatus("正在錄製完整對戰…", "取消");
            close.focus();
            return true;
          } catch {
            if (audio) {
              mix.disconnect(audio);
              audio.stream.getAudioTracks().forEach(track => track.stop());
            }
            if (stream) stream.getTracks().forEach(track => track.stop());
            canvas.dispatchEvent(new Event("fishduel-capture-ended"));
            showStatus("這個瀏覽器無法開始錄製。", "關閉");
            return false;
          }
        },
        finish() {
          if (!active || active.recorder.state === "inactive") return;
          active.finished = true;
          active.recorder.stop();
        },
        cancel() {
          cancel(false);
        }
      };
    })();
  </script>

    <header><h2 id="social-title">好友</h2><button id="social-close">返回魚缸</button></header>
    <nav aria-label="好友功能" hidden></nav>
    <output aria-live="polite"></output><div class="social-content"></div>
  </dialog>
